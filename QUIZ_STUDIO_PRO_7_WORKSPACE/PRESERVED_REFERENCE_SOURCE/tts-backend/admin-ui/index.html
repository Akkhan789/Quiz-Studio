<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Studio Pro · Admin</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#09090b;color:#eee;font:14px system-ui,sans-serif}.wrap{max-width:1000px;margin:auto}.card{background:#151519;border:1px solid #333;border-radius:12px;padding:18px;margin:14px 0}h1,h2{margin-top:0}input,select{padding:10px;border:1px solid #444;border-radius:8px;background:#202027;color:white;width:100%}label{display:block;color:#bbb;font-size:12px;margin:10px 0 5px}button{padding:10px 13px;background:#e62117;color:white;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin:8px 5px 0 0}.secondary{background:#333}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #333}small,.muted{color:#999}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.msg{color:#ffc857;white-space:pre-wrap;margin-top:10px}
</style></head><body><main class="wrap"><h1>Quiz Studio Pro — Admin Console</h1><p class="muted">Secure account management for the configured Quiz Studio Pro backend.</p>
<section class="card"><h2>First-run administrator setup</h2><div class="grid"><div><label>Bootstrap secret</label><input id="bootstrapSecret" type="password"></div><div><label>Admin username</label><input id="adminUser"></div><div><label>Admin password (12+ characters)</label><input id="adminPass" type="password"></div></div><button id="bootstrap">Create first admin</button></section>
<section class="card"><h2>Administrator login</h2><div class="grid"><div><label>Username</label><input id="loginUser"></div><div><label>Password</label><input id="loginPass" type="password"></div></div><button id="login">Login</button><button class="secondary" id="logout">Logout</button><div class="msg" id="msg"></div></section>
<section class="card"><h2>Create user</h2><div class="grid"><div><label>Username</label><input id="newUser"></div><div><label>Initial password (12+ characters)</label><input id="newPass" type="password"></div><div><label>Plan</label><input id="plan" value="Standard"></div><div><label>Expiry (ISO 8601 UTC, optional)</label><input id="expiry" placeholder="2027-01-01T00:00:00+00:00"></div></div><button id="create">Create user</button></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Users</h2><button id="refresh" class="secondary">Refresh</button></div><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Plan</th><th>Expiry</th><th>Enabled</th><th>Device</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></div></section></main>
<script>
const $=id=>document.getElementById(id),TOKEN='qsp_admin_token';let token=sessionStorage.getItem(TOKEN)||'';
function say(t){$('msg').textContent=t}
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});let j={};try{j=await r.json()}catch(_){}if(!r.ok)throw Error(j.detail||('HTTP '+r.status));return j}
$('bootstrap').onclick=async()=>{try{const j=await api('/admin/bootstrap','POST',{bootstrapSecret:$('bootstrapSecret').value,username:$('adminUser').value,password:$('adminPass').value});say(j.message||'Admin created. Sign in below.')}catch(e){say('Bootstrap failed: '+e.message)}};
$('login').onclick=async()=>{try{const j=await api('/account/login','POST',{username:$('loginUser').value,password:$('loginPass').value,deviceId:'admin-console',deviceName:'Admin Web Console'});token=j.token;sessionStorage.setItem(TOKEN,token);say('Administrator authenticated.');await refresh()}catch(e){say('Login failed: '+e.message)}};
$('logout').onclick=()=>{token='';sessionStorage.removeItem(TOKEN);$('users').innerHTML='';say('Logged out.')};
$('create').onclick=async()=>{try{await api('/admin/users','POST',{username:$('newUser').value,password:$('newPass').value,plan:$('plan').value,expiresAt:$('expiry').value||null});say('User created.');await refresh()}catch(e){say('Create failed: '+e.message)}};
async function refresh(){try{const data=await api('/admin/users');$('users').innerHTML='';for(const u of data.users){const tr=document.createElement('tr');const vals=[u.id,u.username,u.role,u.plan,u.expires_at||'Never',u.enabled?'Yes':'No',u.device_name||'Unbound'];vals.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});const actions=document.createElement('td');const toggle=document.createElement('button');toggle.textContent=u.enabled?'Disable':'Enable';toggle.onclick=async()=>{try{await api('/admin/users/'+u.id,'PATCH',{enabled:!u.enabled});await refresh()}catch(e){say(e.message)}};const reset=document.createElement('button');reset.textContent='Reset device';reset.className='secondary';reset.onclick=async()=>{try{await api('/admin/users/'+u.id,'PATCH',{resetDevice:true});await refresh()}catch(e){say(e.message)}};const pw=document.createElement('button');pw.textContent='Reset password';pw.className='secondary';pw.onclick=async()=>{const p=prompt('New password (at least 12 characters)');if(!p)return;if(p.length<12){say('Password must be at least 12 characters.');return}try{await api('/admin/users/'+u.id,'PATCH',{newPassword:p});say('Password reset. User must sign in again.');await refresh()}catch(e){say(e.message)}};const plan=document.createElement('button');plan.textContent='Update plan/expiry';plan.className='secondary';plan.onclick=async()=>{const p=prompt('Plan name',u.plan);if(p===null)return;const x=prompt('Expiry ISO 8601 (blank = never)',u.expires_at||'');try{await api('/admin/users/'+u.id,'PATCH',{plan:p,expiresAt:x||null});await refresh()}catch(e){say(e.message)}};actions.append(toggle,reset,pw,plan);tr.appendChild(actions);$('users').appendChild(tr)}}catch(e){say('User list failed: '+e.message)}}
$('refresh').onclick=refresh;
</script></body></html>
